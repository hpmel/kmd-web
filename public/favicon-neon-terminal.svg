<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="neon-glow-term" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b9d" />
      <stop offset="100%" stop-color="#d900ff" />
    </linearGradient>
  </defs>

  <!-- Background Screen -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#09030d" stroke="url(#pink-grad)" stroke-width="8" />

  <!-- Terminal Top Header Bar -->
  <line x1="32" y1="128" x2="480" y2="128" stroke="#ff2a85" stroke-opacity="0.3" stroke-width="4" />
  <circle cx="96" cy="80" r="12" fill="#ff2a85" opacity="0.9" />
  <circle cx="140" cy="80" r="12" fill="#ff70b8" opacity="0.6" />
  <circle cx="184" cy="80" r="12" fill="#ff00e1" opacity="0.6" />

  <!-- Terminal Prompt > _ -->
  <g filter="url(#neon-glow-term)" stroke="url(#pink-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Arrow > -->
    <path d="M 112 208 L 224 288 L 112 368" />
    <!-- Underscore Cursor _ -->
    <line x1="272" y1="368" x2="384" y2="368" />
  </g>
</svg>
